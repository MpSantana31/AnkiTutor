# git-cliff configuration for AnkiTutor
# https://git-cliff.org/docs/configuration
#
# Regenerate CHANGELOG.md for a release:
#   git-cliff --tag vX.Y.Z --output CHANGELOG.md
#
# Preview unreleased commits:
#   git-cliff --unreleased

[changelog]
header = """
# Changelog

All notable changes to AnkiTutor are documented here.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{%- for commit in commits %}
- {{ commit.message | upper_first }}{% if commit.scope %} ({{ commit.scope }}){% endif %}{% if commit.breaking %} **[breaking]**{% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true
render_always = true
postprocessors = [
  { pattern = '^## \[unreleased\]', replace = "## [Unreleased]" },
  { pattern = '🚀 Features', replace = "Added" },
  { pattern = '🐛 Bug Fixes', replace = "Fixed" },
  { pattern = '📚 Documentation', replace = "Documentation" },
  { pattern = '⚡ Performance', replace = "Performance" },
  { pattern = '🚜 Refactor', replace = "Changed" },
  { pattern = '🎨 Styling', replace = "Styling" },
  { pattern = '🧪 Testing', replace = "Testing" },
  { pattern = '⚙️ Miscellaneous Tasks', replace = "Miscellaneous" },
  { pattern = '🛡️ Security', replace = "Security" },
  { pattern = '◀️ Revert', replace = "Revert" },
  { pattern = '💼 Other', replace = "Other" },
]

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
commit_preprocessors = [
  { pattern = '\(#(\d+)\)', replace = " ([#${1}](https://github.com/MpSantana31/AnkiTutor/pull/${1}))" },
]
protect_breaking_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^test", group = "Testing" },
  { message = "^style", group = "Styling" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps", skip = true },
  { message = "^chore|^ci", group = "Miscellaneous" },
  { body = ".*security", group = "Security" },
  { message = "^revert", group = "Revert" },
]
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = []
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
